# The cluster's manifest seam. Render it with:
#
#   kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/k8s
#
# The flag is required because the topics ConfigMap is generated from the REAL
# src/raincheck/topics.py, which sits outside this directory. That is the point: the six
# partitions / 48 h retention live in exactly one file, and the Job runs that file.
# tests/test_cluster_manifests.py renders through this same command.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - karpenter-nodepool.yaml
  - serviceaccounts.yaml
  - kafka/namespace.yaml
  - kafka/storageclass.yaml
  - kafka/kafka.yaml
  - kafka/topics-job.yaml
  - raincheck/build.yaml
  - raincheck/streaming.yaml
  - airflow/postgres.yaml
  - raincheck/precip-live.yaml
  - raincheck/live.yaml
# THE one place any image is named (cloud 03). Every manifest writes `image: raincheck`
# and this transformer rewrites all of them together, so a half-updated rollout - some
# pods on the new sha, some on the old - is not expressible. scripts/cloud-image.sh
# rewrites these two lines after it pushes, and the pin is committed with the code it
# names. NEVER `:latest`: a moving tag makes "which code produced this partition?"
# unanswerable, and with imagePullPolicy IfNotPresent it serves a stale image forever.
images:
  - name: raincheck
    newName: 384555717200.dkr.ecr.us-east-1.amazonaws.com/raincheck
    newTag: 32176c4abafd
configMapGenerator:
  - name: raincheck-topics
    namespace: kafka
    files:
      - topics.py=../../src/raincheck/topics.py
