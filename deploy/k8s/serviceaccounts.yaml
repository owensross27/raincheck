# Cloud ticket 07 - the R2 credential split, as ServiceAccount-bound Secrets.
#
# R2 is Cloudflare, so IRSA cannot scope it: IRSA mints AWS STS credentials, and R2
# speaks S3 with a Cloudflare API token that AWS has never heard of. The least-privilege
# split is therefore three R2 API TOKENS by role, and the rule this file encodes is
# ONE Secret <-> ONE ServiceAccount, never shared:
#
#   role           bucket             holder
#   capture-write  raincheck-bronze   the capture box (systemd + .env, ticket 18/19) -
#                                     outside this cluster, so no Secret here
#   build          raincheck-bronze   raincheck-build below (batch, streaming, Airflow)
#   serve          the public bucket  raincheck-serve below (export path only)
#
# The Secret objects are NOT in this repo and never will be. scripts/r2-secrets.sh
# creates them from the operator's environment; the rotation procedure lives in
# .scratch/cloud/issues/07-secrets-iam-network.md.
#
# NO Service of type LoadBalancer or NodePort may be added to this directory - that
# absence, plus security groups with zero CIDR sources, is what "no inbound from the
# internet" means here. Subnet placement is NOT providing it (there is no NAT Gateway;
# nodes sit in public subnets with public IPs at $3.65/node/mo).
---
apiVersion: v1
kind: Namespace
metadata:
  name: raincheck
  labels:
    Project: raincheck-cloud
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: raincheck-build
  namespace: raincheck
  annotations:
    # The binding tests/test_cluster_manifests.py enforces: exactly one R2 Secret per
    # ServiceAccount, and no two ServiceAccounts naming the same Secret.
    raincheck.io/r2-secret: r2-build
    raincheck.io/r2-bucket: raincheck-bronze
    raincheck.io/consumers: "cloud 03 batch + streaming, cloud 05 live path, cloud 06 Airflow remote logging"
    # No eks.amazonaws.com/role-arn on purpose: this workload calls no AWS API. ECR pull
    # is the node role (AmazonEC2ContainerRegistryPullOnly, kubelet-level, not an
    # application permission); EBS CSI and Karpenter already hold their own IRSA roles.
    # Adding an AWS call here means a NEW IAM role, which is a Ross decision - see the
    # IRSA inventory in the ticket file before annotating this.
    raincheck.io/aws-role: "none - this workload calls no AWS API"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: raincheck-serve
  namespace: raincheck
  annotations:
    raincheck.io/r2-secret: r2-serve
    # Cloud ticket 09 owns the public bucket's name. Whatever it picks, this token is
    # scoped to that ONE bucket and MUST NOT be raincheck-bronze (spec sec.9: "public"
    # and "the archive" can never be the same bucket). The manifest test asserts both.
    raincheck.io/r2-bucket: raincheck-public
    raincheck.io/consumers: "cloud 09 serving cutover, cloud 05 live-export publisher"
    raincheck.io/aws-role: "none - this workload calls no AWS API"
