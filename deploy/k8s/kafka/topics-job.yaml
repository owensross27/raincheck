# `make topics` as a Kubernetes Job. This is the ONLY thing that creates the two bus
# topics - the Strimzi Topic Operator is disabled precisely so this stays true.
#
# The script is not baked into an image: the ConfigMap is generated from the real
# src/raincheck/topics.py at render time (see deploy/k8s/kustomization.yaml), so there is
# no second copy of the six-partition spec to drift. PYTHONPATH=/src plus the
# raincheck/ subdirectory makes `python -m raincheck.topics` work as a namespace package,
# i.e. the same entry point as `make topics`.
#
# T3 has now replaced the pip install with the shared sha-tagged ECR image. The install was
# ~15 s of network on EVERY run of this Job for a package the image already carries, and
# per-run setup is a recurring bill - it belongs in the image layer, once per git sha.
# The ConfigMap mount stays: PYTHONPATH=/src still shadows the image's own copy (verified
# in the image, /src/raincheck/topics.py wins over the editable install), so the six
# partitions still come from the one file rather than from whenever the image was built.
# The Job name is fixed, so re-running means deleting it first (the install script does).
apiVersion: batch/v1
kind: Job
metadata:
  name: topics
  namespace: kafka
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: raincheck-topics
    spec:
      restartPolicy: Never
      nodeSelector:
        raincheck.io/pool: floor
      containers:
        - name: topics
          image: raincheck
          command: ["python"]
          args: ["-m", "raincheck.topics"]
          env:
            - name: PYTHONPATH
              value: /src
            - name: RAINCHECK_KAFKA
              value: raincheck-kafka-bootstrap.kafka.svc:9092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: src
              mountPath: /src/raincheck
      volumes:
        - name: src
          configMap:
            name: raincheck-topics
