# What the floor actually has, and what is already on it that no manifest in this repo
# declares. Cloud ticket 06 added this because "Airflow's full footprint is counted against
# the floor before it is installed" needs a number to count against, and two of the three
# inputs are invisible to a manifest test:
#
#   1. ALLOCATABLE IS NOT THE INSTANCE SIZE. A t4g.large is 2 vCPU / 8 GiB; what the
#      kubelet offers pods is 1930m / 7069Mi, because the kubelet, the OS and the eviction
#      threshold are reserved first. T1's requests table assumed "4 vCPU and ~14.2Gi
#      allocatable"; measured, the floor is 3860m / 14138Mi. The gap is small and it is
#      the wrong direction to guess about.
#   2. THINGS ON THE FLOOR THAT deploy/k8s DOES NOT DECLARE. kube-system, Karpenter, the
#      EBS CSI driver and the Strimzi operator are installed by eksctl and by Helm, so a
#      test that only sums this repo's manifests would conclude the floor is nearly empty.
#      T1's table guessed 600m for that row; it measures 980m.
#
# Every number here was read off the live cluster on the date below, with
#   kubectl get nodes -o custom-columns=...allocatable...
#   kubectl describe node <each>            # "Allocated resources"
#   kubectl get pods -A -o custom-columns=...resources.requests...
# Re-measure and edit this file when the floor changes shape; do not extrapolate it.
#
# tests/test_cluster_manifests.py sums this + every floor-pinned workload in deploy/k8s +
# every floor-pinned Airflow component in deploy/airflow/values.yaml, and fails if the
# total does not fit. The third spot node (`maxSize: 3` on the floor nodegroup) is the
# resolution when it stops fitting - a decision taken against the budget alarm, with the
# ~$20.73/mo it adds ($17.08 t4g.large spot + $3.65 public IPv4) stated out loud, because
# it does not fit inside the $130 envelope. Never a silent scale-up.

measured_at: 2026-08-24
cluster: raincheck

floor:
  nodes: 2
  instance_type: t4g.large      # Graviton spot, us-east-1f, managed nodegroup `floor`
  allocatable_per_node:
    cpu_millis: 1930
    memory_mib: 7069            # 7239588Ki, rounded down

# On the floor, requesting resources, and not declared anywhere in deploy/k8s.
unmanaged:
  - name: kube-system + karpenter
    cpu_millis: 880
    memory_mib: 1212
    detail: >-
      Both nodes summed: coredns x2 (100m/70Mi each), kube-proxy x2 (100m), aws-node x2
      (2x25m), ebs-csi-node x2 (3x10m/104Mi), ebs-csi-controller x2 (6x10m/232Mi),
      metrics-server x2 (100m/200Mi). Karpenter's own two pods request nothing.
      Installed by eksctl and its addons (cloud 01).
  - name: strimzi-cluster-operator
    cpu_millis: 100
    memory_mib: 256
    detail: >-
      Helm-installed by scripts/cloud-kafka-install.sh with an explicit floor nodeSelector
      (cloud 02). The BROKER it manages is declared in deploy/k8s/kafka/kafka.yaml and is
      counted from there, not here.
