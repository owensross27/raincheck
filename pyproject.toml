[project]
name = "raincheck"
version = "0.1.0"
description = "NYC bus stream x weather Zarr pipeline (Kafka + Spark/Sedona)"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "gtfs-realtime-bindings>=1.0",
    "requests>=2.31",
    "pyarrow>=16",
    "pandas>=2.1",
    "xarray>=2024.6",
    "zarr>=2.18",
    "s3fs>=2024.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raincheck"]
