[project]
name = "raincheck"
version = "0.1.0"
description = "NYC bus stream x weather Zarr pipeline (Kafka + Spark/Sedona)"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "gtfs-realtime-bindings>=1.0",
    "requests>=2.31",
    "pyarrow>=16",
    "pandas>=2.1,<4",  # pyspark 3.5.3's pandas bridge uses shims that Pandas4Warning says go in 4
    "xarray>=2024.6",
    "zarr>=2.18",
    "s3fs>=2024.6",
    "pytest>=8",
    "pyyaml",  # tests/test_cluster_manifests.py parses the rendered cluster manifests
    # spec A: Spark 3.5.3 + Sedona 1.9.1 in-process on the brew JDK 17; no Python h3
    # (the only H3 oracle is DuckDB's community h3 extension, installed by the tests that need it)
    "pyspark==3.5.3",
    "apache-sedona==1.9.1",
    "setuptools",  # pyspark's pandas bridge imports distutils on Python 3.12
    "shapely",
    "pyproj",
    "duckdb",
    "pytz",  # DuckDB hands back tz-aware timestamps through pytz
    # MRMS GRIB2 decode (ticket 11). >=2.47 not >=2.48: `eccodes.__version__` reports the
    # C LIBRARY version (2.48.0, shipped by the eccodeslib wheel it pulls in), while the
    # python package it is pinning tops out at 2.47.0. The old pin was that number read
    # from the wrong namespace and resolved on no platform at all -- the Mac venv predates
    # it. Found by cloud 08's downscale exercise on a clean arm64 Linux box.
    "eccodes>=2.47",
]

# Great Expectations is OPTIONAL and no pipeline module imports it: only
# `raincheck.gx` does, lazily, and a missing library there is INCONCLUSIVE rather than a
# crash. Pinned to MAJOR VERSION 1 deliberately - the 0.x and 1.x context/checkpoint APIs
# differ substantially (0.x's DataContext/`checkpoint.run` vs 1.x's
# `ValidationDefinition`/`ExpectationSuite` objects), and raincheck.gx is written against
# 1.x only. Measured with 1.21.0 on 2026-08-25; core GX pulls altair, pydantic, marshmallow,
# ruamel.yaml, scipy and tqdm and NOT sqlalchemy - the pandas path needs no engine.
[project.optional-dependencies]
gx = ["great-expectations>=1,<2"]

# The MCP SDK is OPTIONAL for the same reason GX is: no pipeline module imports it, only
# `raincheck.notify_mcp` does and only inside `server()`, so a tree without it still
# imports the module and still runs every dispatch test (the suite gains no skip family --
# nothing in this repo tests the protocol). Pinned to MAJOR VERSION 2 deliberately: 1.x's
# server class is `mcp.server.fastmcp.FastMCP`, 2.x renamed it to
# `mcp.server.mcpserver.MCPServer` and the v1 import path now raises outright, so a `>=1`
# pin would resolve to a tree this module cannot import. Measured with 2.1.1 on 2026-08-26.
mcp = ["mcp>=2.1,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raincheck"]
