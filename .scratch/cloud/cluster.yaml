# raincheck cloud T1 — EKS cluster, floor nodegroup, Karpenter.
# Region/VPC are forced: spec §1 requires the cluster to share the capture box's
# VPC, and the box (i-098a6ea89c4b15502) is us-east-1f / vpc-049a68bf6017d6ead.
# us-east-1e is deliberately absent — EKS does not support it.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: raincheck
  region: us-east-1
  version: "1.34"
  tags:
    Project: raincheck-cloud   # the $130 budget filter keys on this — see issues/01

vpc:
  id: vpc-049a68bf6017d6ead
  subnets:
    public:
      us-east-1f: { id: subnet-002ac7537c7b84cdb }   # box AZ; the floor lives here
      us-east-1a: { id: subnet-096cc43fb33956ecd }
      us-east-1c: { id: subnet-0888a347b53cea6c6 }
  clusterEndpoints:
    publicAccess: true    # kubectl from the Mac; API auth is IAM, not a network hole
    privateAccess: true

iam:
  withOIDC: true

# Floor. Pinned to us-east-1f because EBS is AZ-bound (spec §1) and because that is
# where the archiver's broker path terminates — same-AZ in-VPC traffic is free.
# Spot with no on-demand node: every floor workload is restartable by design.
managedNodeGroups:
  - name: floor
    availabilityZones: ["us-east-1f"]
    instanceTypes: ["t4g.large"]     # 2 vCPU / 8 GiB arm64; requests table needs ~3.85 vCPU / 8.5Gi
    amiFamily: AmazonLinux2023
    spot: true
    desiredCapacity: 2
    minSize: 2
    maxSize: 3                       # spec §1's "third spot node decided against the budget alarm"
    volumeSize: 30
    volumeType: gp3
    privateNetworking: false         # no NAT Gateway (spec §7): nodes need a public IP for egress
    tags:
      Project: raincheck-cloud
    labels:
      raincheck.io/pool: floor

karpenter:
  version: "1.14.1"
  withSpotInterruptionQueue: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

cloudWatch:
  clusterLogging:
    enableTypes: []   # control-plane logs are ~$0.50/GB ingest; not worth the envelope
