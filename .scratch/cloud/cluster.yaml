# raincheck cloud T1 — EKS cluster, floor nodegroup, Karpenter.
# Region/VPC are forced: spec §1 requires the cluster to share the capture box's
# VPC, and the box (i-098a6ea89c4b15502) is us-east-1f / vpc-049a68bf6017d6ead.
# us-east-1e is deliberately absent — EKS does not support it.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: raincheck
  region: us-east-1
  version: "1.34"
  tags:
    Project: raincheck-cloud   # the $200 budget filter keys on this — see issues/01

vpc:
  id: vpc-049a68bf6017d6ead
  subnets:
    public:
      us-east-1f: { id: subnet-002ac7537c7b84cdb }   # box AZ; the floor lives here
      us-east-1a: { id: subnet-096cc43fb33956ecd }
      us-east-1c: { id: subnet-0888a347b53cea6c6 }
  clusterEndpoints:
    publicAccess: true    # kubectl from the Mac; API auth is IAM, not a network hole
    privateAccess: true

iam:
  withOIDC: true

# Floor. STATELESS ONLY, and deliberately spread — see the 2026-08-25 outage below.
#
# WHAT THIS SHAPE IS DEFENDING AGAINST. Until 2026-08-25 this nodegroup was
# `instanceTypes: ["t4g.large"]` x `availabilityZones: ["us-east-1f"]` — ONE spot
# capacity pool — with CapacityRebalance on. At 09:42:04Z the ASG terminated the last
# instance on a rebalance recommendation and then could not relaunch into that pool:
# 30+ UnfulfillableCapacity failures over four hours. Because Karpenter, the Strimzi
# operator and all three Airflow deployments were pinned to this one nodegroup, the
# WHOLE CLUSTER went down and could not self-heal — Karpenter refuses to run on nodes
# it provisioned (`karpenter.sh/nodepool DoesNotExist`), so the one component that could
# have made replacement capacity was the one component that could not schedule.
#
# Measured that day with `aws ec2 get-spot-placement-scores --target-capacity 2`:
#   t4g.large alone      -> us-east-1f 1/10  (1a 1, 1c 3, 1b 3, 1d 3)
#   the 5-type mix below -> us-east-1f 2/10, us-east-1a 9/10, us-east-1c 9/10
# So diversifying INSTANCE TYPES alone would not have saved it. The AZ was the binding
# constraint, which is why this group now spans three.
#
# Every type below is Graviton and >= t4g.large on BOTH axes (2 vCPU / 8 GiB), so
# deploy/cloud/floor-capacity.yaml's allocatable numbers stay a conservative floor
# whichever pool wins. price-capacity-optimized picks the cheapest with capacity.
#
# NOTHING AZ-BOUND MAY BE PINNED HERE. The three workloads with EBS volumes (the Kafka
# broker, the Airflow metadata DB, the streaming driver) moved to the `stateful` Karpenter
# NodePool in deploy/k8s/karpenter-nodepool.yaml, which picks their AZ from the PVC's
# allowedTopologies and falls back to on-demand when 1f spot is dry. If you pin a pod
# with a PVC to `raincheck.io/pool: floor`, you have rebuilt the outage.
managedNodeGroups:
  - name: floor
    availabilityZones: ["us-east-1a", "us-east-1c", "us-east-1f"]
    instanceTypes:                   # 15 spot pools (5 types x 3 AZs), was 1
      - t4g.large                    # 2 vCPU /  8 GiB — the original, still cheapest
      - m6g.large                    # 2 vCPU /  8 GiB
      - m7g.large                    # 2 vCPU /  8 GiB
      - r6g.large                    # 2 vCPU / 16 GiB
      - m6gd.large                   # 2 vCPU /  8 GiB
    amiFamily: AmazonLinux2023
    spot: true
    desiredCapacity: 2
    minSize: 2
    maxSize: 3                       # spec §1's "third spot node decided against the budget alarm"
    volumeSize: 30
    volumeType: gp3
    privateNetworking: false         # no NAT Gateway (spec §7): nodes need a public IP for egress
    tags:
      Project: raincheck-cloud
    labels:
      raincheck.io/pool: floor

karpenter:
  version: "1.14.1"
  withSpotInterruptionQueue: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: eks-pod-identity-agent
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

cloudWatch:
  clusterLogging:
    enableTypes: []   # control-plane logs are ~$0.50/GB ingest; not worth the envelope
